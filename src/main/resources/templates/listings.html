<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Listings</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 6px; box-shadow: 0px 2px 4px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 8px 12px; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-success { background-color: #28a745; }
        .btn-primary { background-color: #007bff; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; }
        .actions { margin-top: 10px; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1>Marketplace Listings</h1>
    <div>
        <a th:href="@{/listings/profile}" class="btn btn-primary">My Profile</a>
        <a th:href="@{/logout}" class="btn btn-danger">Logout</a>
    </div>
</div>

<!-- Form to Add New Listing -->
<div class="card">
    <h2>Add New Listing</h2>
    <form th:action="@{/listings/create}" th:object="${newListing}" method="post">
        <div class="form-group">
            <label>Title</label>
            <input type="text" th:field="*{title}" required />
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea th:field="*{description}" required></textarea>
        </div>
        <div class="form-group">
            <label>Price ($)</label>
            <input type="number" step="0.01" th:field="*{price}" required />
        </div>
        <button type="submit" class="btn btn-success">Create Listing</button>
    </form>
</div>

<!-- List of Existing Listings -->
<h2>Current Listings</h2>
<div th:if="${listings.empty}">
    <p>No listings available yet.</p>
</div>

<div th:each="listing : ${listings}" class="card">
    <h3 th:text="${listing.title}">Listing Title</h3>
    <p th:text="${listing.description}">Description goes here...</p>
    <p><strong>Price: $<span th:text="${listing.price}">0.00</span></strong></p>

    <div class="actions" th:if="${currentUser != null and ((listing.user != null and listing.user.id == currentUser.id) or currentUser.role == 'ADMIN')}">
    <a th:href="@{/listings/edit/{id}(id=${listing.id})}" class="btn btn-warning">Edit</a>

    <form th:action="@{/listings/delete/{id}(id=${listing.id})}" method="post" style="display:inline;">
        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
    </form>
</div>
</div>

</body>
</html>
