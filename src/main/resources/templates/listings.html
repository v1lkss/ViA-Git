<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard - Listings</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .listing-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 6px; box-shadow: 0px 2px 4px rgba(0,0,0,0.1); }
        .btn { padding: 8px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-primary { background: #007bff; }
    </style>
</head>
<body>

<div class="header">
    <h1>Marketplace Listings</h1>
    <a th:href="@{/login}" class="btn">Logout</a>
</div>

<div th:if="${listings.empty}">
    <p>No listings available yet.</p>
</div>

<div th:each="listing : ${listings}" class="listing-card">
    <h3 th:text="${listing.title}">Listing Title</h3>
    <p th:text="${listing.description}">Description goes here...</p>
    <p><strong>Price: $<span th:text="${listing.price}">0.00</span></strong></p>
</div>

</body>
</html>
